<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 200 200" width="200" height="200">
  <!-- Pen Layer: Blue Shapes -->
  <g id="pen" inkscape:label="pen">
    <rect x="110" y="20" width="70" height="40" fill="none" stroke="blue" stroke-width="2"/>
    <circle cx="145" cy="40" r="10" fill="none" stroke="blue" stroke-width="1.5"/>
    <line x1="110" y1="70" x2="180" y2="70" stroke="blue" stroke-width="2"/>
  </g>
  <!-- Knife Layer: Red Shapes -->
  <g id="knife" inkscape:label="knife">
    <circle cx="50" cy="50" r="30" fill="none" stroke="red" stroke-width="2"/>
    <circle cx="50" cy="50" r="15" fill="none" stroke="red" stroke-width="1.5"/>
    <line x1="10" y1="50" x2="90" y2="50" stroke="red" stroke-width="2"/>
  </g>
  <!-- Crease Layer: Green Shapes -->
  <g id="crease" inkscape:label="crease">
    <rect x="50" y="110" width="60" height="60" fill="none" stroke="green" stroke-width="2"/>
    <rect x="65" y="125" width="30" height="30" fill="none" stroke="green" stroke-width="1.5"/>
    <line x1="50" y1="110" x2="110" y2="170" stroke="green" stroke-width="2"/>
  </g>
</svg>
