<text x="480" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#212529" opacity="0">Records go out a window at a time; each ACK says how far the controller has taken them.<animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0.0000;0.0125;0.0219;0.1812;0.1906;1.0000" values="0;0;1;1;0;0" calcMode="linear"/></text>
<g opacity="0"><rect x="0" y="135" width="74" height="30" rx="5" fill="#2f9e44"/><text x="37.0" y="155" fill="#fff" text-anchor="middle" font-size="13" font-family="ui-monospace, Consolas, monospace">BEZ 7</text><animateTransform attributeName="transform" type="translate" dur="16.0s" repeatCount="indefinite" keyTimes="0.0000;0.2000;0.2563;1.0000" values="190 0;190 0;626 0;626 0" calcMode="linear"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0.0000;0.2000;0.2031;0.2563;0.2594;1.0000" values="0;0;1;1;0;0" calcMode="linear"/></g>
<g opacity="0"><rect x="0" y="205" width="74" height="30" rx="5" fill="#e8590c"/><text x="37.0" y="225" fill="#fff" text-anchor="middle" font-size="13" font-family="ui-monospace, Consolas, monospace">FULL</text><animateTransform attributeName="transform" type="translate" dur="16.0s" repeatCount="indefinite" keyTimes="0.0000;0.2625;0.3188;1.0000" values="626 0;626 0;190 0;190 0" calcMode="linear"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0.0000;0.2625;0.2656;0.3188;0.3219;1.0000" values="0;0;1;1;0;0" calcMode="linear"/></g>
<text x="480" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#e8590c" opacity="0">NACK FULL: the planner queue is full. The session waits, then resends from the first record not taken.<animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0.0000;0.2687;0.2781;0.4313;0.4406;1.0000" values="0;0;1;1;0;0" calcMode="linear"/></text>
<g opacity="0"><rect x="0" y="135" width="74" height="30" rx="5" fill="#2f9e44"/><text x="37.0" y="155" fill="#fff" text-anchor="middle" font-size="13" font-family="ui-monospace, Consolas, monospace">BEZ 7</text><animateTransform attributeName="transform" type="translate" dur="16.0s" repeatCount="indefinite" keyTimes="0.0000;0.3625;0.4188;1.0000" values="190 0;190 0;626 0;626 0" calcMode="linear"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0.0000;0.3625;0.3656;0.4188;0.4219;1.0000" values="0;0;1;1;0;0" calcMode="linear"/></g>
