<text x="480" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#2b8a3e" opacity="0">resume(): the session restarts from the controller's resume point, and the job runs on.<animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0.0000;0.7812;0.7906;0.9750;0.9844;1.0000" values="0;0;1;1;0;0" calcMode="linear"/></text>
