<text x="480" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#e8590c" opacity="0">NACK PAUSED: someone paused the job. The session holds, sends nothing, and waits for resume().<animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0.0000;0.6062;0.6156;0.7625;0.7719;1.0000" values="0;0;1;1;0;0" calcMode="linear"/></text>
