<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
<title>A job streaming: records, ACKs, FULL and PAUSED (animated)</title>
<rect width="960" height="330" fill="#ffffff"/>
<rect x="20" y="70" width="170" height="170" rx="10" fill="#f3f0ff" stroke="#7950f2"/>
<text x="105" y="98" text-anchor="middle" font-weight="700" fill="#5f3dc4">host</text>
<text x="105" y="118" text-anchor="middle" font-size="12" fill="#5f3dc4">Session</text>
<text x="105" y="136" text-anchor="middle" font-size="11" fill="#7048e8">up to 16 records in flight</text>
<rect x="700" y="70" width="240" height="170" rx="10" fill="#ebfbee" stroke="#37b24d"/>
<text x="820" y="98" text-anchor="middle" font-weight="700" fill="#2b8a3e">controller</text>
<text x="820" y="118" text-anchor="middle" font-size="12" fill="#2b8a3e">checks each record in order</text>
<rect x="770" y="250" width="110" height="14" rx="3" fill="#e9ecef"/><rect x="770" y="250" width="20" height="14" rx="3" fill="#2f9e44"><animate attributeName="width" dur="16.0s" repeatCount="indefinite" keyTimes="0.0000;0.1812;0.2687;0.3500;0.5375;0.6000;0.7688;0.8875;1.0000" values="20;96;110;80;100;60;0;70;20"/><animate attributeName="fill" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.2437;0.2687;0.3500;1" values="#2f9e44;#2f9e44;#e8590c;#2f9e44;#2f9e44" calcMode="discrete"/></rect><text x="825" y="282" text-anchor="middle" font-size="12" fill="#495057">planner queue</text>
<line x1="190" y1="150" x2="700" y2="150" stroke="#dee2e6" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="190" y1="220" x2="700" y2="220" stroke="#dee2e6" stroke-width="2" stroke-dasharray="4 6"/>
<text x="445" y="126" text-anchor="middle" font-size="12" fill="#868e96">records →</text>
<text x="445" y="254" text-anchor="middle" font-size="12" fill="#868e96">← replies</text>
<text x="480" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#212529">A job streaming over USB</text>
