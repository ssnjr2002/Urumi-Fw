<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <title>Urumi from above: where the firmware and the host sit</title>
  <defs>
    <pattern id="sheet" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#f8f1e4"/><line x1="0" y1="0" x2="0" y2="12" stroke="#eadcc2" stroke-width="4"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>

  <!-- bed and sheet -->
  <rect x="40" y="60" width="560" height="360" rx="8" fill="#eef1f4" stroke="#adb5bd" stroke-width="2"/>
  <text x="52" y="82" fill="#495057" font-weight="600">bed</text>
  <rect x="90" y="110" width="440" height="270" fill="url(#sheet)" stroke="#d4b98a"/>
  <text x="100" y="370" fill="#8a6d3b" font-size="13">sheet, held down by vacuum</text>
  <path d="M130 300 C 160 170, 230 160, 250 240" fill="none" stroke="#c92a2a" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M370 250 C 400 330, 480 320, 500 190" fill="none" stroke="#c92a2a" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="380" y="355" fill="#c92a2a" font-size="13">the job: curves from an SVG</text>

  <!-- X rails and gantry -->
  <rect x="40" y="46" width="560" height="10" fill="#868e96"/>
  <rect x="40" y="424" width="560" height="10" fill="#868e96"/>
  <rect x="290" y="34" width="34" height="412" rx="4" fill="#495057"/>
  <text x="244" y="26" fill="#212529" font-weight="600" text-anchor="end">gantry</text>
  <line x1="254" y1="22" x2="360" y2="22" stroke="#495057" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="370" y="26" fill="#495057">X</text>

  <!-- the carriage (moves in Y on the gantry): two heads and the laser anchor -->
  <rect x="262" y="176" width="90" height="128" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
  <rect x="270" y="184" width="74" height="48" rx="5" fill="#1971c2"/>
  <text x="307" y="204" fill="#fff" text-anchor="middle" font-weight="600" font-size="13">head 0</text>
  <text x="307" y="222" fill="#d0ebff" text-anchor="middle" font-size="11">Z · A · tool</text>
  <rect x="270" y="248" width="74" height="48" rx="5" fill="#1971c2"/>
  <text x="307" y="268" fill="#fff" text-anchor="middle" font-weight="600" font-size="13">head 1</text>
  <text x="307" y="286" fill="#d0ebff" text-anchor="middle" font-size="11">Z · A · tool</text>
  <circle cx="307" cy="240" r="4" fill="#f03e3e"/>
  <line x1="362" y1="150" x2="362" y2="330" stroke="#495057" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="370" y="156" fill="#495057">Y</text>
  <text x="370" y="244" fill="#c92a2a" font-size="12">laser dot: the anchor, (0, 0)</text>

  <!-- the RS485 pair: one line, every node on it -->
  <path d="M60 490 H660" fill="none" stroke="#e8590c" stroke-width="3"/>
  <text x="60" y="462" fill="#8a5a00" font-size="12">nodes: one small board per axis or device, all on one pair</text>
  <g font-size="12">
    <g transform="translate(60 474)"><rect width="62" height="32" rx="4" fill="#fff3bf" stroke="#e67700"/><text x="31" y="21" text-anchor="middle">X</text></g>
    <g transform="translate(132 474)"><rect width="62" height="32" rx="4" fill="#fff3bf" stroke="#e67700"/><text x="31" y="21" text-anchor="middle">Y</text></g>
    <g transform="translate(204 474)"><rect width="62" height="32" rx="4" fill="#fff3bf" stroke="#e67700"/><text x="31" y="21" text-anchor="middle">Z0 · A0</text></g>
    <g transform="translate(276 474)"><rect width="62" height="32" rx="4" fill="#fff3bf" stroke="#e67700"/><text x="31" y="21" text-anchor="middle">Z1 · A1</text></g>
    <g transform="translate(348 474)"><rect width="62" height="32" rx="4" fill="#fff3bf" stroke="#e67700"/><text x="31" y="21" text-anchor="middle">vacuum</text></g>
    <g transform="translate(420 474)"><rect width="62" height="32" rx="4" fill="#fff3bf" stroke="#e67700"/><text x="31" y="21" text-anchor="middle">knife</text></g>
  </g>
  <text x="590" y="482" fill="#e8590c" font-weight="600" text-anchor="end">RS485</text>

  <!-- controller -->
  <rect x="660" y="450" width="140" height="80" rx="8" fill="#2b8a3e"/>
  <text x="730" y="480" fill="#fff" text-anchor="middle" font-weight="600">controller</text>
  <text x="730" y="499" fill="#d3f9d8" text-anchor="middle" font-size="12">Pico 2 · RP2350</text>
  <text x="730" y="516" fill="#d3f9d8" text-anchor="middle" font-size="12">src/rp2350/</text>

  <!-- host -->
  <rect x="780" y="190" width="150" height="110" rx="8" fill="#5f3dc4"/>
  <rect x="796" y="204" width="118" height="62" rx="3" fill="#e5dbff"/>
  <text x="855" y="230" text-anchor="middle" font-size="12" fill="#3b2a80">urumi console</text>
  <text x="855" y="248" text-anchor="middle" font-size="11" fill="#3b2a80">browser or Node</text>
  <text x="855" y="288" fill="#fff" text-anchor="middle" font-weight="600">host · web/</text>
  <path d="M800 470 H855 V300" fill="none" stroke="#5f3dc4" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="866" y="390" fill="#5f3dc4" font-weight="600">USB</text>

  <!-- legend -->
  <g font-size="13" transform="translate(650 60)">
    <text y="0" font-weight="600" fill="#212529">This repository</text>
    <rect y="14" width="14" height="14" rx="3" fill="#5f3dc4"/><text x="22" y="26">host: library and console</text>
    <rect y="38" width="14" height="14" rx="3" fill="#2b8a3e"/><text x="22" y="50">controller firmware</text>
    <rect y="62" width="14" height="14" rx="3" fill="#fff3bf" stroke="#e67700"/><text x="22" y="74">node firmware</text>
  </g>
  <text x="40" y="548" fill="#868e96" font-size="12">Illustration, not to scale.</text>
</svg>
