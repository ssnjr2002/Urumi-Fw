<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100mm" height="100mm">
  <!-- Explicit Y-flip verification:
       SVG top-left  (0,0)   → machine (0, 100)mm  (top in SVG = far from origin on machine)
       SVG top-right (100,0) → machine (100, 100)mm
       SVG bot-left  (0,100) → machine (0, 0)mm    (bottom in SVG = origin on machine)
       SVG bot-right (100,100)→machine (100, 0)mm
       SVG centre    (50,50) → machine (50, 50)mm  (centre stays centre) -->
  <!-- top edge — should map to machine y=100 -->
  <path d="M 0 0 L 100 0" fill="none" stroke="red"/>
  <!-- bottom edge — should map to machine y=0 -->
  <path d="M 0 100 L 100 100" fill="none" stroke="blue"/>
  <!-- left edge — vertical, x stays 0 -->
  <path d="M 0 0 L 0 100" fill="none" stroke="green"/>
  <!-- diagonal top-left to bot-right -->
  <path d="M 0 0 L 100 100" fill="none" stroke="black"/>
</svg>
