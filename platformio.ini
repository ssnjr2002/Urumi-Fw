; ═══════════════════════════════════════════════════════════════════════════════
; Combined PlatformIO Configuration
;
; ATtiny3224 nodes  (megaTinyCore / Arduino)
; RP2350 host       (Earlephilhower Arduino-Pico)
;
; Flash commands:
;   pio run -e node1 -t upload
;   pio run -e node2 -t upload
;   pio run -e pico  -t upload
; ═══════════════════════════════════════════════════════════════════════════════

[platformio]
default_envs = node1
src_dir      = src
include_dir  = include


; ─── Shared ATtiny3224 base settings ─────────────────────────────────────────
[env:attiny_base]
platform  = atmelmegaavr
board     = ATtiny3224
framework = arduino

board_build.f_cpu  = 20000000L
board_upload.speed = 115200

upload_protocol = serialupdi

build_src_filter = -<*> +<node/main.cpp> +<node/isr.cpp>
build_flags      = -I src/node/attiny3224

; ─── Shared AVR128DB32 base settings ─────────────────────────────────────────
[env:avr128db_base]
platform  = atmelmegaavr
board     = avr128db32
framework = arduino

; board_build.f_cpu = 16000000L
; board_build.f_cpu = 20000000L
board_build.f_cpu = 24000000L
board_hardware.oscillator = crystal
; board_hardware.oscillator = internal
; board_build.f_cpu = 32000000L

upload_protocol = serialupdi

build_src_filter = -<*> +<node/main.cpp> +<node/isr.cpp> +<node/avr128db32/drivers.cpp>
build_flags      = -I src/node/avr128db32 -DDM542

lib_deps =
    TMCStepper

; ─── Per-node environments ───────────────────────────────────────────────────

; ATtiny3224 nodes
[env:node1]
extends     = env:attiny_base
build_flags = ${env:attiny_base.build_flags} -DNODE_ID=1
upload_port = COM19

[env:node2]
extends     = env:attiny_base
build_flags = ${env:attiny_base.build_flags} -DNODE_ID=2
upload_port = COM4

[env:node3]
extends     = env:attiny_base
build_flags = ${env:attiny_base.build_flags} -DNODE_ID=3

[env:node4]
extends     = env:attiny_base
build_flags = ${env:attiny_base.build_flags} -DNODE_ID=4

; AVR128DB32 nodes (DM542 by default; swap -DDM542 for -DDRV8825 or -DTMC_2660 per node)
[env:db_node1]
extends     = env:avr128db_base
build_flags = ${env:avr128db_base.build_flags} -DNODE_ID=1 -DDM542

[env:db_node2]
extends     = env:avr128db_base
build_flags = ${env:avr128db_base.build_flags} -DNODE_ID=2 -DDM542

[env:db_node3]
extends     = env:avr128db_base
build_flags = ${env:avr128db_base.build_flags} -DNODE_ID=3

[env:db_node4]
extends     = env:avr128db_base
build_flags = ${env:avr128db_base.build_flags} -DNODE_ID=4


; ─── RP2350 Host (Pico 2) ───────────────────────────────────────────────────

[env:pico]
platform  = https://github.com/maxgerhardt/platform-raspberrypi.git
board     = rpipico2
framework = arduino
board_build.core = earlephilhower

build_flags =
    -DSERIAL_BUFFER_SIZE=256

board_build.pio = src/rp2350/uart_9bit.pio

upload_protocol = picotool
upload_port     = COM8

; Only compile the Pico source files
build_src_filter = -<*> +<rp2350/*>

