; ═══════════════════════════════════════════════════════════════════════════════
; Combined PlatformIO Configuration
;
; ATtiny3224 nodes  (megaTinyCore / Arduino)
; AVR128DB32 nodes  (DxCore / Arduino)
; RP2350 host       (Earlephilhower Arduino-Pico)
;
; ───────────────────────────────────────────────────────────────────────────────
; CLOCK CAVEAT: each env's f_cpu MUST match the physical board's actual oscillator
; (crystal value or the tinyAVR OSCCFG-fuse-selected internal 16/20 MHz). A
; mismatch is invisible until something needs correct timing: every baud runs off
; by the ratio, so RS485 and the serial console silently garble (e.g. 20-vs-16 MHz
; -> 115200 arrives as 92160). Two boards here already differed from their base
; template — knife_node6 (16 MHz, not 24) and vac_node5 (16 MHz, not 20) — both
; fixed with a per-env `board_build.f_cpu` override. When bringing up a NEW board,
; verify its real clock (the hello_serial* probe makes this easy) before trusting
; the bus.
; ═══════════════════════════════════════════════════════════════════════════════

[platformio]
default_envs = node1
src_dir      = src
include_dir  = include

; ─── Shared ATtiny3224 base settings (template section, not an env) ───────────
[attiny_base]
platform  = atmelmegaavr
board     = ATtiny3224
framework = arduino

board_build.f_cpu  = 20000000L
board_upload.speed = 115200

upload_protocol = serialupdi

; Type-agnostic MCU template (a plain section, not an env, so it is never built
; without a type). Each node env below composes a node type into it.
build_src_filter =
    -<*>
    ${node_core.build_src_filter}
build_flags      = -I src/node -I src/node/board/attiny3224

; ─── Shared ATtiny3226 base settings (template section, not an env) ───────────
; SOIC-20 sibling of the 3224 (same tinyAVR-2 peripherals, more I/O). Used for
; pin-hungry types like the 6-servo + SSR vacuum node that do not fit the 3224.
[attiny3226_base]
platform  = atmelmegaavr
board     = ATtiny3226
framework = arduino

board_build.f_cpu  = 20000000L
board_upload.speed = 115200

upload_protocol = serialupdi

build_src_filter =
    -<*>
    ${node_core.build_src_filter}
build_flags      = -I src/node -I src/node/board/attiny3226

; ─── Shared AVR128DB32 base settings (template section, not an env) ───────────
[avr128db_base]
platform  = atmelmegaavr
board     = avr128db32
framework = arduino

; board_build.f_cpu = 16000000L
; board_build.f_cpu = 20000000L
board_build.f_cpu = 24000000L
board_hardware.oscillator = crystal
; board_hardware.oscillator = internal
; board_build.f_cpu = 32000000L

upload_protocol = serialupdi

; Type-agnostic MCU template (a plain section, not an env, so it is never built
; without a type). Each db_node env below composes a node type into it.
; type_stepper pulls drivers.cpp itself, so no per-env driver source needed.
build_src_filter =
    -<*>
    ${node_core.build_src_filter}
build_flags      = -I src/node -I src/node/board/avr128db32

lib_deps =
    TMCStepper

; ─── Node core + transport (type-agnostic, always compiled) ──────────────────
[node_core]
build_src_filter = +<node/main.cpp> +<node/dispatch.cpp> +<node/rs485/rs485.cpp>

; ─── Node type: stepper ──────────────────────────────────────────────────────
; Every node currently on the bus is a stepper. A type contributes its source
; and its NODE_TYPE identity flag; each node env below composes it onto an MCU
; template (which already carries node_core). A future non-motion type (e.g.
; type_vacuum) would instead pull +<node/rs485/isr_generic.cpp> and its own
; +<node/types/<t>/*.cpp>, and its envs would compose that instead.
[type_stepper]
build_src_filter = +<node/types/stepper/*>
build_flags      = -DNODE_TYPE=NODE_TYPE_STEPPER

; ─── Node type: vacuum ───────────────────────────────────────────────────────
; Non-motion type (6 servos + soft-started SSR pump). Unlike stepper it does not
; own the RX ISR, so it pulls the generic framing ISR (isr_generic.cpp) that the
; core deliberately leaves out of node_core.
[type_vacuum]
build_src_filter = +<node/types/vacuum/*> +<node/rs485/isr_generic.cpp>
build_flags      = -DNODE_TYPE=NODE_TYPE_VACUUM

; ─── Node type: knife ────────────────────────────────────────────────────────
; Non-motion type (oscillating drag knife + PWM blower). Like vacuum it does not
; own the RX ISR, so it pulls the generic framing ISR (isr_generic.cpp).
[type_knife]
build_src_filter = +<node/types/knife/*> +<node/rs485/isr_generic.cpp>
build_flags      = -DNODE_TYPE=NODE_TYPE_KNIFE_OSC

; ─── Per-node environments ───────────────────────────────────────────────────

; ATtiny3224 nodes — each composes the MCU template with a node type (type_stepper).
[env:node1]
extends          = attiny_base
build_src_filter = ${attiny_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags      = ${attiny_base.build_flags} ${type_stepper.build_flags} -DNODE_ID=1
upload_port      = COM19

[env:node2]
extends          = attiny_base
build_src_filter = ${attiny_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags      = ${attiny_base.build_flags} ${type_stepper.build_flags} -DNODE_ID=2
upload_port      = COM4

[env:node3]
extends          = attiny_base
build_src_filter = ${attiny_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags      = ${attiny_base.build_flags} ${type_stepper.build_flags} -DNODE_ID=3

[env:node4]
extends          = attiny_base
build_src_filter = ${attiny_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags      = ${attiny_base.build_flags} ${type_stepper.build_flags} -DNODE_ID=4

; ATtiny3226 vacuum node — composes the 3226 MCU template with type_vacuum.
; This physical board's OSCCFG fuse selects the 16 MHz internal oscillator (not
; the 20 MHz attiny3226_base assumes), so override f_cpu — otherwise every
; baud/timing runs 20/16 fast (RS485 921600 -> 737280, Serial 115200 -> 92160).
; 16 MHz is also the safer floor after this board's brownout history.
[env:vac_node7]
extends          = attiny3226_base
board_build.f_cpu = 16000000L
build_src_filter = ${attiny3226_base.build_src_filter} ${type_vacuum.build_src_filter}
build_flags      = ${attiny3226_base.build_flags} ${type_vacuum.build_flags} -DNODE_ID=7

; ATtiny3226 vacuum node — DEBUG build. Adds the USART0 bench console
; (debug_console.cpp, PB2 TX / PB3 RX) so a PC can drive the node directly with
; host/node_console.py — no Pico or RS485 bus needed. Identical firmware to
; vac_node5 otherwise; not for production. RS485 (USART1) still works normally.
[env:vac_node7_dbg]
extends          = attiny3226_base
board_build.f_cpu = 16000000L
build_src_filter = ${attiny3226_base.build_src_filter} ${type_vacuum.build_src_filter} +<node/debug_console.cpp>
build_flags      = ${attiny3226_base.build_flags} ${type_vacuum.build_flags} -DNODE_ID=7 -DNODE_DEBUG_CONSOLE

; AVR128DB32 knife node — composes the DB32 MCU template with type_knife.
; This physical board has a 16 MHz crystal (NOT the 24 MHz the db_node stepper
; boards use), so override f_cpu here — otherwise every baud/timing runs 1.5x off
; (RS485 921600 -> 614400, Serial 115200 -> 76800).
[env:knife_node8]
extends          = avr128db_base
board_build.f_cpu = 16000000L
build_src_filter = ${avr128db_base.build_src_filter} ${type_knife.build_src_filter}
build_flags      = ${avr128db_base.build_flags} ${type_knife.build_flags} -DNODE_ID=8 -DRS485_USE_XDIR

; AVR128DB32 knife node — DEBUG build. Adds the bench console (Serial1, PC0/PC1
; per board.h HAL_DEBUG_SERIAL) + host/node_console.py, like db_node3_dbg.
[env:knife_node8_dbg]
extends          = avr128db_base
board_build.f_cpu = 16000000L
build_src_filter = ${avr128db_base.build_src_filter} ${type_knife.build_src_filter} +<node/debug_console.cpp>
build_flags      = ${avr128db_base.build_flags} ${type_knife.build_flags} -DNODE_ID=8 -DRS485_USE_XDIR -DNODE_DEBUG_CONSOLE

; AVR128DB32 nodes — each composes the MCU template with a node type
; (type_stepper here). DM542 by default; swap -DDM542 for -DDRV8825 or -DTMC_2660.
[env:db_node1]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags      = ${avr128db_base.build_flags} ${type_stepper.build_flags} -DNODE_ID=1 -DDM542 -DRS485_USE_XDIR

; AVR128DB32 stepper node WITH a laser on PD2 (-DNODE_HAS_LASER reclaims the pin
; from the thermistor input). Only ONE stepper node carries the laser; the flag
; makes every other stepper NAK CMD_LASER. Debug console included so the laser is
; benchable directly (`laser 1` / `laser 0` via host/node_console.py). Change
; NODE_ID/driver to match the physical laser node; drop the console + rename for
; the production build.
[env:db_node2_laser_dbg]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter} +<node/debug_console.cpp>
build_flags =
    ${avr128db_base.build_flags}
    ${type_stepper.build_flags}
    -DNODE_ID=2
    -DDM542
    -DRS485_USE_XDIR
    -DNODE_HAS_LASER
    -DNODE_DEBUG_CONSOLE

[env:db_node2]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags      = ${avr128db_base.build_flags} ${type_stepper.build_flags} -DNODE_ID=2 -DDM542 -DRS485_USE_XDIR

[env:db_node3]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags =
    ${avr128db_base.build_flags} 
    ${type_stepper.build_flags}
    -DNODE_ID=3
    -DRS485_USE_XDIR
    -DDRV8825

; AVR128DB32 stepper node — DEBUG build. Adds the bench console
; (debug_console.cpp) + host/node_console.py, like vac_node5_dbg. RS485 is on
; USART2 (PF0/PF1); the console runs on Serial1 (USART1, PC0/PC1) per board.h's
; HAL_DEBUG_SERIAL — the USART this board's USB-serial adapter is wired to.
[env:db_node3_dbg]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter} +<node/debug_console.cpp>
build_flags =
    ${avr128db_base.build_flags}
    ${type_stepper.build_flags}
    -DNODE_ID=3
    -DRS485_USE_XDIR
    -DTMC_2660
    -DTMC_CURRENT=1500
    -DTMC_MICROSTEPPING=16
    -DNODE_DEBUG_CONSOLE

[env:db_node4]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags =
    ${avr128db_base.build_flags} 
    ${type_stepper.build_flags}
    -DNODE_ID=4
    -DRS485_USE_XDIR
    -DDRV8825
    -DNODE_HAS_LASER

[env:db_node5]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags =
    ${avr128db_base.build_flags} 
    ${type_stepper.build_flags}
    -DNODE_ID=5
    -DRS485_USE_XDIR
    -DDRV8825

[env:db_node6]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags =
    ${avr128db_base.build_flags} 
    ${type_stepper.build_flags}
    -DNODE_ID=6
    -DRS485_USE_XDIR
    -DDRV8825

; ─── Scratch: serial bring-up probe (standalone, not the node firmware) ───────
; Compiles ONLY src/scratch/hello_serial.cpp — no node core / RS485 / HAL. The
; USART is picked via -DHELLO_SERIAL=<instance>. Two envs below select the free
; USART each board's USB-serial adapter is wired to.

; AVR-DB (RS485 on USART2) -> probe Serial1 (USART1, PC0/PC1).
; NOTE: this env inherits avr128db_base's 24 MHz f_cpu (correct for the stepper
; DB boards). The knife board has a 16 MHz crystal — if you point this env at it,
; add `board_build.f_cpu = 16000000L` here too or serial comes out at 76800, not
; 115200 (see knife_node6 for the same override).
[env:hello_serial1]
extends          = avr128db_base
build_src_filter = -<*> +<scratch/hello_serial.cpp>
build_flags      = -DHELLO_SERIAL=Serial1
upload_port      = COM4

; ATtiny3226 (RS485 on USART1) -> probe Serial (USART0, PB2/PB3).
; The vacuum board runs on the 16 MHz internal oscillator (see vac_node5) — match
; it here or the banner comes out at 92160, not 115200.
[env:hello_serial0_tiny]
extends          = attiny3226_base
board_build.f_cpu = 16000000L
build_src_filter = -<*> +<scratch/hello_serial.cpp>
build_flags      = -DHELLO_SERIAL=Serial
upload_port      = COM19

; ─── RP2350 Host (Pico 2) ───────────────────────────────────────────────────

[env:pico]
platform  = https://github.com/maxgerhardt/platform-raspberrypi.git
board     = rpipico2
framework = arduino
board_build.core = earlephilhower

build_flags =
    -DSERIAL_BUFFER_SIZE=256
    -DDEBUG_TIMING        ; adds texp/tmeas/twall to `getstate` — comment out when done diagnosing

board_build.pio = src/rp2350/core1/bus/uart_9bit.pio

; Reserve the top of flash for the config blob store (config/config_store.*).
; This shrinks the linker's program region so program code can never overlap the
; store; config_store addresses it via the _FS_start/_FS_end symbols. LittleFS is
; never mounted — we repurpose this span as raw config flash. 128 KB holds the
; two 36 KB A/B slots (72 KB) with headroom.
board_build.filesystem_size = 128k

upload_protocol = picotool
upload_port     = COM8

; Only compile the Pico source files
build_src_filter = -<*> +<rp2350/**>


; ─── Host (native) — planner port tests ──────────────────────────────────────
; The odd env in this file: it uploads nothing and targets no board. It builds
; lib/motion (the C++ planner port) with the host compiler and runs two SEPARATE
; test suites against it:
;
;   test/test_contract  — properties, invariants and scaling laws, stated in
;                         physics terms. Survive a rewrite; they are the safety
;                         net that remains once bit-parity is retired.
;   test/test_parity    — bit-equality against vectors generated from the
;                         TypeScript. No epsilon. Fails on ANY optimisation,
;                         correct or not, which is exactly why it cannot be the
;                         only net.
;
; Kept apart so each can be run alone — the contract suite is the one that will
; still be meaningful after the planner is optimised, and running it by itself
; must not require the reference vectors to be present.
;
;     pio test -e native                          both
;     pio test -e native -f test_contract         properties only
;     pio test -e native -f test_parity           bit-equality only
;
; test/main.cpp (the doctest runner) and test/support/*.h sit in the test_dir
; root, which PlatformIO shares into every suite.
;
; -msse2 -mfpmath=sse is MANDATORY, not tuning. The local host g++ is
; i686-w64-mingw32, whose default x87 path evaluates intermediates in 80-bit
; registers; that silently breaks the bit-equality the port is validated by
; (docs/planner_audit.md, "Numeric porting rule"). Harmless on x86_64 hosts,
; where SSE2 is already the default.
[env:native]
platform       = native
test_framework = doctest
test_filter    = test_contract, test_parity
build_flags =
    -I test
    -std=c++17
    -O2
    -msse2
    -mfpmath=sse
    -Wall
    -Wextra
