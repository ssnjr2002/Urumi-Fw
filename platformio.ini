; ═══════════════════════════════════════════════════════════════════════════════
; Combined PlatformIO Configuration
;
; ATtiny3224 nodes  (megaTinyCore / Arduino)
; RP2350 host       (Earlephilhower Arduino-Pico)
;
; Flash commands:
;   pio run -e node1 -t upload
;   pio run -e node2 -t upload
;   pio run -e pico  -t upload
; ═══════════════════════════════════════════════════════════════════════════════

[platformio]
default_envs = node1
src_dir      = src
include_dir  = include


; ─── Shared ATtiny3224 base settings ─────────────────────────────────────────
[env:attiny_base]
platform  = atmelmegaavr
board     = ATtiny3224
framework = arduino

board_build.f_cpu  = 20000000L
board_upload.speed = 115200

upload_protocol = serialupdi

; Only compile the ATtiny source files
build_src_filter = -<*> +<attiny3224/*>


; ─── Per-node environments ───────────────────────────────────────────────────

[env:node1]
extends     = env:attiny_base
build_flags = ${env:attiny_base.build_flags} -DNODE_ID=1
upload_port = COM21

[env:node2]
extends     = env:attiny_base
build_flags = ${env:attiny_base.build_flags} -DNODE_ID=2
upload_port = COM4

[env:node3]
extends     = env:attiny_base
build_flags = ${env:attiny_base.build_flags} -DNODE_ID=3

[env:node4]
extends     = env:attiny_base
build_flags = ${env:attiny_base.build_flags} -DNODE_ID=4


; ─── RP2350 Host (Pico 2) ───────────────────────────────────────────────────

[env:pico]
platform  = https://github.com/maxgerhardt/platform-raspberrypi.git
board     = rpipico2
framework = arduino
board_build.core = earlephilhower

build_flags =
    -DSERIAL_BUFFER_SIZE=256

upload_protocol = picotool
upload_port     = COM8

; Only compile the Pico source files
build_src_filter = -<*> +<rp2350/*>

