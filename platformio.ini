; How this file is put together: docs/system/firmware-build.md

[platformio]
default_envs = node1
src_dir      = src
include_dir  = include

; ─── MCU templates ───────────────────────────────────────────────────────────

[attiny_base]
platform           = atmelmegaavr
board              = ATtiny3224
framework          = arduino
board_build.f_cpu  = 20000000L
board_upload.speed = 115200
upload_protocol    = serialupdi
build_src_filter   =
    -<*>
    ${node_core.build_src_filter}
build_flags        = -I src/node -I src/node/board/attiny3224

[attiny3226_base]
platform           = atmelmegaavr
board              = ATtiny3226
framework          = arduino
board_build.f_cpu  = 20000000L
board_upload.speed = 115200
upload_protocol    = serialupdi
build_src_filter   =
    -<*>
    ${node_core.build_src_filter}
build_flags        = -I src/node -I src/node/board/attiny3226

[avr128db_base]
platform                  = atmelmegaavr
board                     = avr128db32
framework                 = arduino
board_build.f_cpu         = 24000000L
board_hardware.oscillator = crystal
upload_protocol           = serialupdi
build_src_filter          =
    -<*>
    ${node_core.build_src_filter}
build_flags               = -I src/node -I src/node/board/avr128db32
lib_deps                  = TMCStepper

; ─── Node core and types ─────────────────────────────────────────────────────

[node_core]
build_src_filter = +<node/main.cpp> +<node/dispatch.cpp> +<node/rs485/rs485.cpp>

[type_stepper]
build_src_filter = +<node/types/stepper/*>
build_flags      = -DNODE_TYPE=NODE_TYPE_STEPPER

[type_vacuum]
build_src_filter = +<node/types/vacuum/*> +<node/rs485/isr_generic.cpp>
build_flags      = -DNODE_TYPE=NODE_TYPE_VACUUM

[type_knife]
build_src_filter = +<node/types/knife/*> +<node/rs485/isr_generic.cpp>
build_flags      = -DNODE_TYPE=NODE_TYPE_KNIFE_OSC

; ─── ATtiny3224 stepper nodes ────────────────────────────────────────────────

[env:node1]
extends          = attiny_base
build_src_filter = ${attiny_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags      =
    ${attiny_base.build_flags}
    ${type_stepper.build_flags}
    -DNODE_ID=1
upload_port      = COM19

[env:node2]
extends          = attiny_base
build_src_filter = ${attiny_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags      =
    ${attiny_base.build_flags}
    ${type_stepper.build_flags}
    -DNODE_ID=2
upload_port      = COM4

[env:node3]
extends          = attiny_base
build_src_filter = ${attiny_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags      =
    ${attiny_base.build_flags}
    ${type_stepper.build_flags}
    -DNODE_ID=3

[env:node4]
extends          = attiny_base
build_src_filter = ${attiny_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags      =
    ${attiny_base.build_flags}
    ${type_stepper.build_flags}
    -DNODE_ID=4

; ─── ATtiny3226 vacuum node ──────────────────────────────────────────────────

; Shares NODE_ID 7 with vac_db_node7: only one of the two on the bus at a time.
[env:vac_node7]
extends           = attiny3226_base
board_build.f_cpu = 16000000L   ; OSCCFG fuse selects the 16 MHz internal oscillator
build_src_filter  = ${attiny3226_base.build_src_filter} ${type_vacuum.build_src_filter}
build_flags       =
    ${attiny3226_base.build_flags}
    ${type_vacuum.build_flags}
    -DNODE_ID=7
    -DNODE_HAS_PROBE_REPLY

[env:vac_node7_dbg]
extends           = attiny3226_base
board_build.f_cpu = 16000000L   ; OSCCFG fuse selects the 16 MHz internal oscillator
build_src_filter  = ${attiny3226_base.build_src_filter} ${type_vacuum.build_src_filter} +<node/debug_console.cpp>
build_flags       =
    ${attiny3226_base.build_flags}
    ${type_vacuum.build_flags}
    -DNODE_ID=7
    -DNODE_HAS_PROBE_REPLY
    -DNODE_DEBUG_CONSOLE

; ─── AVR128DB32 vacuum node ──────────────────────────────────────────────────

; Shares NODE_ID 7 with vac_node7: only one of the two on the bus at a time.
[env:vac_db_node7]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_vacuum.build_src_filter}
build_flags      =
    ${avr128db_base.build_flags}
    ${type_vacuum.build_flags}
    -DNODE_ID=7
    -DRS485_USE_XDIR
    -DBOARD_DB32_VACUUM
    -DNODE_HAS_PROBE_REPLY

[env:vac_db_node7_dbg]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_vacuum.build_src_filter} +<node/debug_console.cpp>
build_flags      =
    ${avr128db_base.build_flags}
    ${type_vacuum.build_flags}
    -DNODE_ID=7
    -DRS485_USE_XDIR
    -DBOARD_DB32_VACUUM
    -DNODE_HAS_PROBE_REPLY
    -DNODE_DEBUG_CONSOLE

; ─── AVR128DB32 knife node ───────────────────────────────────────────────────

[env:knife_node8]
extends           = avr128db_base
board_build.f_cpu = 16000000L   ; this board has a 16 MHz crystal
build_src_filter  = ${avr128db_base.build_src_filter} ${type_knife.build_src_filter}
build_flags       =
    ${avr128db_base.build_flags}
    ${type_knife.build_flags}
    -DNODE_ID=8
    -DRS485_USE_XDIR

[env:knife_node8_dbg]
extends           = avr128db_base
board_build.f_cpu = 16000000L   ; this board has a 16 MHz crystal
build_src_filter  = ${avr128db_base.build_src_filter} ${type_knife.build_src_filter} +<node/debug_console.cpp>
build_flags       =
    ${avr128db_base.build_flags}
    ${type_knife.build_flags}
    -DNODE_ID=8
    -DRS485_USE_XDIR
    -DNODE_DEBUG_CONSOLE

; ─── AVR128DB32 stepper nodes ────────────────────────────────────────────────

[env:db_node1]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags      =
    ${avr128db_base.build_flags}
    ${type_stepper.build_flags}
    -DNODE_ID=1
    -DRS485_USE_XDIR
    -DDM542
    -DHAS_LIMIT_SWITCH
    -DLIMIT_ACTIVE_HIGH
upload_port      = COM15

[env:db_node2]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags      =
    ${avr128db_base.build_flags}
    ${type_stepper.build_flags}
    -DNODE_ID=2
    -DRS485_USE_XDIR
    -DDM542
    -DHAS_LIMIT_SWITCH
    -DLIMIT_ACTIVE_HIGH

; Only one node carries the laser; the others refuse CMD_LASER.
[env:db_node2_laser_dbg]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter} +<node/debug_console.cpp>
build_flags      =
    ${avr128db_base.build_flags}
    ${type_stepper.build_flags}
    -DNODE_ID=2
    -DRS485_USE_XDIR
    -DDM542
    -DNODE_HAS_LASER
    -DNODE_DEBUG_CONSOLE

[env:db_node3]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags      =
    ${avr128db_base.build_flags}
    ${type_stepper.build_flags}
    -DNODE_ID=3
    -DRS485_USE_XDIR
    -DDRV8825
    -DHAS_LIMIT_SWITCH
    -DLIMIT_ACTIVE_HIGH
    -DNODE_HAS_LASER

[env:db_node3_dbg]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter} +<node/debug_console.cpp>
build_flags      =
    ${avr128db_base.build_flags}
    ${type_stepper.build_flags}
    -DNODE_ID=3
    -DRS485_USE_XDIR
    -DTMC_2660
    -DTMC_CURRENT=1500
    -DTMC_MICROSTEPPING=16
    -DNODE_DEBUG_CONSOLE

; Microstepping is strapped in solder on this board: the flag must match it.
; The hall index uses the limit switch's pin.
[env:db_node4]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags      =
    ${avr128db_base.build_flags}
    ${type_stepper.build_flags}
    -DNODE_ID=4
    -DRS485_USE_XDIR
    -DDRV8825
    -DDRV_MICROSTEPPING=16
    -DHAS_HALL_INDEX

[env:db_node4_dbg]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter} +<node/debug_console.cpp>
build_flags      =
    ${avr128db_base.build_flags}
    ${type_stepper.build_flags}
    -DNODE_ID=4
    -DRS485_USE_XDIR
    -DDRV8825
    -DDRV_MICROSTEPPING=16
    -DHAS_HALL_INDEX
    -DNODE_HAS_LASER
    -DNODE_DEBUG_CONSOLE

; Microstepping is strapped in solder on this board: the flag must match it.
[env:db_node5]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags      =
    ${avr128db_base.build_flags}
    ${type_stepper.build_flags}
    -DNODE_ID=5
    -DRS485_USE_XDIR
    -DDRV8825
    -DDRV_MICROSTEPPING=16
    -DHAS_HALL_INDEX

[env:db_node6]
extends          = avr128db_base
build_src_filter = ${avr128db_base.build_src_filter} ${type_stepper.build_src_filter}
build_flags      =
    ${avr128db_base.build_flags}
    ${type_stepper.build_flags}
    -DNODE_ID=6
    -DRS485_USE_XDIR
    -DDRV8825
    -DHAS_LIMIT_SWITCH
    -DLIMIT_ACTIVE_HIGH

; ─── Scratch ─────────────────────────────────────────────────────────────────

; Clock probe for DB32 boards. Set f_cpu to the board's clock first.
[env:hello_serial1]
extends          = avr128db_base
build_src_filter = -<*> +<scratch/hello_serial.cpp>
build_flags      = -DHELLO_SERIAL=Serial1
upload_port      = COM4

; Clock probe for the ATtiny3226 vacuum board.
[env:hello_serial0_tiny]
extends           = attiny3226_base
board_build.f_cpu = 16000000L
build_src_filter  = -<*> +<scratch/hello_serial.cpp>
build_flags       = -DHELLO_SERIAL=Serial
upload_port       = COM19

; Hall sample capture from db_node4. Throwaway: delete once the index
; estimator is written.
[env:hall_capture]
extends          = avr128db_base
build_src_filter = -<*> +<scratch/hall_capture.cpp>
build_flags      =
    -DCAP_SERIAL=Serial1
    -DCAP_MICROSTEPPING=16
    -DCAP_ADC_BITS=13
upload_port      = COM15

; ─── Controller ──────────────────────────────────────────────────────────────

[env:pico]
platform                    = https://github.com/maxgerhardt/platform-raspberrypi.git
board                       = rpipico2
framework                   = arduino
board_build.core            = earlephilhower
board_build.filesystem_size = 128k
build_src_filter            = -<*> +<rp2350/**>
build_flags                 =
    -DSERIAL_BUFFER_SIZE=256
    -DPICO_ALLOW_UNCONFIGURED
    ; -DACCEPT_LASER_AS_POWER_TOOL
    ; Run the planner's tick path from RAM, like the other step emitters
    '-DPLANNER_RAM=__attribute__((section(".time_critical.planner")))'
    ; sqrtf as the hardware instruction; nothing reads errno
    -fno-math-errno
lib_deps                    = bblanchon/ArduinoJson@^7
extra_scripts               = pre:scripts/pio/config_image.py
custom_config_json          = config/controller.jsonc
custom_mesh_json            = config/mesh-bench.jsonc
; custom_mesh_json          = config/mesh-jagged.jsonc
upload_protocol             = picotool
upload_port                 = COM8

; ─── Tests ───────────────────────────────────────────────────────────────────

[env:native]
platform       = native
test_framework = doctest
test_filter    = test_cjog, test_config, test_ipc, test_machine, test_planner, test_runner, test_sequence, test_steps
lib_deps       = bblanchon/ArduinoJson@^7
build_flags    =
    -I test
    -I test/stubs
    -std=c++17
    -O2
    ; Single-precision float maths, like the RP2350's FPU (the x87 default
    ; keeps 80-bit intermediates)
    -msse2
    -mfpmath=sse
    -Wall
    -Wextra
