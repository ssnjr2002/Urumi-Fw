<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 200 200" width="200" height="200">
  <!-- Pen Layer: Rectangle -->
  <g id="pen" inkscape:label="pen">
    <rect x="110" y="20" width="70" height="40" fill="none" stroke="blue" stroke-width="2"/>
  </g>
  <!-- Knife Layer: Circle -->
  <g id="knife" inkscape:label="knife">
    <circle cx="50" cy="50" r="30" fill="none" stroke="red" stroke-width="2"/>
  </g>
  <!-- Crease Layer: Square -->
  <g id="crease" inkscape:label="crease">
    <rect x="50" y="110" width="60" height="60" fill="none" stroke="green" stroke-width="2"/>
  </g>
</svg>
