<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>barebones</title>
</head>
<body>
  <h1>barebones</h1>
  <button id="connect">Connect</button>
  <button id="disconnect" disabled>Disconnect</button>
  <br><br>
  <label for="config-file">JSON Config: </label>
  <input type="file" id="config-file" accept="application/json">
  <br><br>
  <button id="push-config" disabled>Push config</button>
  <button id="pull-config" disabled>Pull config</button>
  <button id="status-cfg" disabled>cfg</button>
  <h2>Jog</h2>
  <label><input type="checkbox" id="jog-keys"> Key jog (hold: W/S = +Y/−Y, A/D = −X/+X, R/F = +Z/−Z, Q/E = −A/+A)</label>
  <label>Speed (× jogFeed): <input type="number" id="jog-speed" min="0.02" max="3.98" step="0.25" value="1"></label>
  <span id="jog-dir"></span>
  <div>Offset:
    <label><input type="radio" name="head" value="0"> head 0</label>
    <label><input type="radio" name="head" value="1"> head 1</label>
    <label><input type="radio" name="head" value="anchor"> anchor</label>
  </div>
  <h2>Job</h2>
  <label for="svg-file">SVG: </label>
  <input type="file" id="svg-file" accept="image/svg+xml,.svg">
  <label for="layer">Layer: </label>
  <select id="layer" disabled></select>
  <br><br>
  <label>Cut feed (mm/s): <input type="number" id="cut-feed" min="0" step="any" value="80"></label>
  <label>Travel feed (mm/s): <input type="number" id="travel-feed" min="0" step="any" value="80"></label>
  <br><br>
  <label>Offset X (mm): <input type="number" id="offset-x" step="any" value="0"></label>
  <label>Offset Y (mm): <input type="number" id="offset-y" step="any" value="0"></label>
  <br><br>
  <button id="prepare" disabled>Prepare</button>
  <button id="run" disabled>Run</button>
  <button id="abort" disabled>Abort</button>
  <p>Open the devtools console to see what's happening.</p>
  <script type="module" src="./barebones.js"></script>
</body>
</html>
